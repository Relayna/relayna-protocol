<svg xmlns="http://www.w3.org/2000/svg" width="736" height="540" viewBox="0 0 736 540" role="img" aria-labelledby="title description">
  <title id="title">Relayna Protocol core architecture</title>
  <desc id="description">Gateway (Rust), SDK (Python), Spooltail (Rust), Cell (Go), and Studio (Python and TypeScript) all use versioned contracts defined by Relayna Protocol in Protobuf, JSON Schema, and OpenAPI.</desc>

  <rect x="0.5" y="0.5" width="735" height="539" rx="16" fill="#2b2b2b" stroke="#404040"/>

  <g fill="none" stroke="#96a6bb" stroke-width="2">
    <path d="M141 124V176H595V124 M368 124V195"/>
    <path d="M368 323V354 M141 405V354H595V405"/>
  </g>

  <g text-anchor="middle" font-family="system-ui, sans-serif">
    <g>
      <rect x="27" y="25" width="228" height="99" rx="13" fill="#393129" stroke="#e88000" stroke-width="2"/>
      <text x="141" y="66" fill="#ed850b" font-size="23" font-weight="700">Gateway</text>
      <text x="141" y="97" fill="#f8f8fa" font-size="19" font-weight="500">Rust</text>
    </g>

    <g>
      <rect x="277" y="25" width="182" height="99" rx="13" fill="#2d333d" stroke="#60aaff" stroke-width="2"/>
      <text x="368" y="66" fill="#60aaff" font-size="23" font-weight="700">SDK</text>
      <text x="368" y="97" fill="#f8f8fa" font-size="19" font-weight="500">Python</text>
    </g>

    <g>
      <rect x="481" y="25" width="228" height="99" rx="13" fill="#33343e" stroke="#858cff" stroke-width="2"/>
      <text x="595" y="66" fill="#8b92ff" font-size="23" font-weight="700">Spooltail</text>
      <text x="595" y="97" fill="#f8f8fa" font-size="19" font-weight="500">Rust</text>
    </g>

    <g>
      <rect x="169.5" y="195" width="397" height="128" rx="19" fill="#313234" stroke="#96a6bb" stroke-width="3"/>
      <text x="368" y="234" fill="#f8f8fa" font-size="26" font-weight="700">Relayna Protocol</text>
      <text x="368" y="267" fill="#f8f8fa" font-size="19" font-weight="500">Protobuf · JSON Schema · OpenAPI</text>
      <text x="368" y="296" fill="#f8f8fa" font-size="19" font-weight="500">Versioned shared contracts</text>
